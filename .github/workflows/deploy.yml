# Production deploy to GitHub Pages from main.
# Publishes the static export to the ROOT of the gh-pages branch so it coexists
# with PR previews under pr-preview/ (pr-preview.yml). GitHub Pages serves a
# single source; "Deploy from a branch" (gh-pages) is the source the preview
# action requires, so production and previews share one source instead of
# fighting over it.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Push the built site to the gh-pages branch.
permissions:
  contents: write

# Serialize production deploys; don't cancel an in-progress one.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        # Pet projects are discovered from GitHub at build time
        # (lib/github-projects.ts) — GITHUB_TOKEN is REQUIRED or the build fails.
        # The default token authenticates discovery and covers public repos; to
        # also surface PRIVATE pet-project repos, set a PROJECTS_TOKEN secret (a
        # PAT with read access to the private repos) — the default GITHUB_TOKEN
        # is scoped to this repo only and cannot see them.
        env:
          GITHUB_TOKEN: ${{ secrets.PROJECTS_TOKEN || secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: Add .png extension to OG image
        run: |
          mv out/opengraph-image out/opengraph-image.png
          grep -rl '/opengraph-image?' out --include='*.html' \
            | xargs -r sed -i 's|/opengraph-image?|/opengraph-image.png?|g'

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./out
          # Keep the pr-preview/ subtree already on the branch — only the
          # production files at the root are overwritten.
          keep_files: true
